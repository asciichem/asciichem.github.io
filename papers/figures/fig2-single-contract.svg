<svg xmlns="http://www.w3.org/2000/svg" width="680" height="376" viewBox="0 0 680 376" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>

  <!-- CENTER: the two contract boxes -->
  <rect x="270" y="40" width="140" height="52" rx="4" fill="#eef2f7" stroke="#5b7da6" stroke-width="1.5"/>
  <text x="340" y="62" text-anchor="middle" font-size="12.5" font-weight="bold">asciichem-model</text>
  <text x="340" y="78" text-anchor="middle" font-size="10.5" fill="#555">wire schemas, set v1 (tags)</text>

  <rect x="270" y="108" width="140" height="52" rx="4" fill="#eef2f7" stroke="#5b7da6" stroke-width="1.5"/>
  <text x="340" y="130" text-anchor="middle" font-size="12.5" font-weight="bold">asciichem-tests</text>
  <text x="340" y="146" text-anchor="middle" font-size="10.5" fill="#555">conformance corpus (tags)</text>

  <line x1="340" y1="92" x2="340" y2="108" stroke="#333" stroke-width="1.2" marker-end="url(#arrow2)"/>
  <text x="350" y="104" font-size="9.5" fill="#666">fixtures bind to schemas</text>

  <!-- SEEDED GENERATION into corpus -->
  <rect x="60" y="108" width="150" height="44" rx="4" fill="#fff" stroke="#8a6d3b" stroke-dasharray="5 3"/>
  <text x="135" y="126" text-anchor="middle" font-size="11.5">property harness</text>
  <text x="135" y="141" text-anchor="middle" font-size="10.5" fill="#555">seeded generation (300)</text>
  <line x1="210" y1="130" x2="268" y2="130" stroke="#333" stroke-width="1.2" marker-end="url(#arrow2)"/>
  <text x="239" y="122" text-anchor="middle" font-size="9.5" fill="#666">new fixtures</text>

  <!-- FOUR CI LANES -->
  <g font-size="12">
    <rect x="255" y="200" width="82" height="34" rx="3" fill="#e8f4ea" stroke="#2e7d43"/>
    <text x="296" y="221" text-anchor="middle">Ruby</text>
    <text x="296" y="230" text-anchor="middle" font-size="8.5" fill="#2e7d43">reference</text>

    <rect x="345" y="200" width="82" height="34" rx="3" fill="#fff" stroke="#2e7d43"/>
    <text x="386" y="221" text-anchor="middle">TypeScript</text>

    <rect x="435" y="200" width="82" height="34" rx="3" fill="#fff" stroke="#2e7d43"/>
    <text x="476" y="221" text-anchor="middle">Python</text>

    <rect x="525" y="200" width="82" height="34" rx="3" fill="#fff" stroke="#2e7d43"/>
    <text x="566" y="221" text-anchor="middle">Rust</text>
  </g>

  <!-- lanes from corpus down to each CI box -->
  <line x1="310" y1="160" x2="296" y2="198" stroke="#333" stroke-width="1.1" marker-end="url(#arrow2)"/>
  <line x1="330" y1="160" x2="386" y2="198" stroke="#333" stroke-width="1.1" marker-end="url(#arrow2)"/>
  <line x1="350" y1="160" x2="476" y2="198" stroke="#333" stroke-width="1.1" marker-end="url(#arrow2)"/>
  <line x1="370" y1="160" x2="566" y2="198" stroke="#333" stroke-width="1.1" marker-end="url(#arrow2)"/>

  <text x="340" y="188" text-anchor="middle" font-size="10" fill="#555">same pinned corpus tag gates every CI</text>

  <!-- claims row -->
  <text x="340" y="256" text-anchor="middle" font-size="11" fill="#555">each implementation claims only the levels its CI gates prove (L0–L4)</text>

  <!-- ORACLE CORPUS feeding identity gate -->
  <rect x="120" y="292" width="190" height="56" rx="4" fill="#fff" stroke="#7a5ba6" stroke-width="1.3"/>
  <text x="215" y="312" text-anchor="middle" font-size="12" font-weight="bold">InChI oracle corpus</text>
  <text x="215" y="328" text-anchor="middle" font-size="9.5" fill="#555">chemomer/inchi-tests</text>
  <text x="215" y="341" text-anchor="middle" font-size="9.5" fill="#555">(recordings; byte-exact gate)</text>

  <rect x="430" y="296" width="130" height="48" rx="4" fill="#eef2f7" stroke="#5b7da6"/>
  <text x="495" y="315" text-anchor="middle" font-size="12">identity gate</text>
  <text x="495" y="330" text-anchor="middle" font-size="10" fill="#555">InChI / InChIKey / AuxInfo</text>

  <line x1="310" y1="320" x2="428" y2="320" stroke="#333" stroke-width="1.2" marker-end="url(#arrow2)"/>
  <text x="369" y="366" text-anchor="middle" font-size="9.5" fill="#666">oracle absent from runtimes</text>

  <line x1="340" y1="172" x2="340" y2="182" stroke="#999" stroke-width="1" stroke-dasharray="3 2"/>
</svg>
