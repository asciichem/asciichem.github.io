<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
    <pattern id="hatch" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#f2f2f2"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#c0392b" stroke-width="2"/>
    </pattern>
  </defs>

  <text x="170" y="20" text-anchor="middle" font-size="14" font-weight="bold">AsciiMath: the phantom carrier</text>
  <text x="510" y="20" text-anchor="middle" font-size="14" font-weight="bold">AsciiChem: the isotope binds the atom</text>

  <!-- LEFT PANEL: AsciiMath -->
  <text x="170" y="46" text-anchor="middle" font-family="Courier, monospace" font-size="15">{}</text>
  <text x="182" y="40" text-anchor="middle" font-family="Courier, monospace" font-size="15">14</text>
  <text x="196" y="46" text-anchor="middle" font-family="Courier, monospace" font-size="15">C</text>
  <text x="170" y="62" text-anchor="middle" font-size="11" fill="#666">input: {}^14C</text>

  <line x1="170" y1="70" x2="170" y2="88" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- msup tree -->
  <rect x="118" y="92" width="84" height="24" rx="3" fill="#eef2f7" stroke="#5b7da6"/>
  <text x="160" y="108" text-anchor="middle" font-size="12">msup</text>
  <line x1="130" y1="116" x2="88" y2="142" stroke="#333" stroke-width="1"/>
  <line x1="190" y1="116" x2="232" y2="142" stroke="#333" stroke-width="1"/>

  <rect x="48" y="146" width="86" height="26" fill="url(#hatch)" stroke="#c0392b" stroke-width="1.5"/>
  <text x="91" y="163" text-anchor="middle" font-size="11" fill="#c0392b">base: empty</text>
  <rect x="202" y="146" width="60" height="26" rx="3" fill="#fff" stroke="#333"/>
  <text x="232" y="163" text-anchor="middle" font-size="12">mn: 14</text>

  <!-- the carbon: a sibling token, not a property carrier -->
  <rect x="266" y="92" width="54" height="24" rx="3" fill="#fff" stroke="#999" stroke-dasharray="4 2"/>
  <text x="293" y="108" text-anchor="middle" font-size="12" fill="#666">"C"</text>
  <text x="293" y="128" text-anchor="middle" font-size="10" fill="#666">(sibling text)</text>

  <text x="170" y="248" text-anchor="middle" font-size="12" fill="#c0392b">14 attaches to an empty group:</text>
  <text x="170" y="264" text-anchor="middle" font-size="12" fill="#c0392b">the isotope is never a property of carbon</text>

  <!-- RIGHT PANEL: AsciiChem -->
  <text x="510" y="46" text-anchor="middle" font-family="Courier, monospace" font-size="15">^14C</text>
  <text x="510" y="62" text-anchor="middle" font-size="11" fill="#666">input: ^14C</text>

  <line x1="510" y1="70" x2="510" y2="88" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="448" y="92" width="124" height="24" rx="3" fill="#e8f4ea" stroke="#2e7d43"/>
  <text x="510" y="108" text-anchor="middle" font-size="12">Atom</text>
  <line x1="480" y1="116" x2="462" y2="142" stroke="#2e7d43" stroke-width="1"/>
  <line x1="540" y1="116" x2="558" y2="142" stroke="#2e7d43" stroke-width="1"/>

  <rect x="430" y="146" width="64" height="26" rx="3" fill="#fff" stroke="#2e7d43"/>
  <text x="462" y="163" text-anchor="middle" font-size="12">element: C</text>
  <rect x="528" y="146" width="60" height="26" rx="3" fill="#fff" stroke="#2e7d43"/>
  <text x="558" y="163" text-anchor="middle" font-size="12">isotope: 14</text>

  <text x="510" y="200" text-anchor="middle" font-size="12" fill="#2e7d43">Atom(element: "C", isotope: "14")</text>

  <!-- rejection -->
  <rect x="452" y="220" width="116" height="24" rx="3" fill="#fff" stroke="#c0392b" stroke-dasharray="4 2"/>
  <text x="510" y="236" text-anchor="middle" font-family="Courier, monospace" font-size="12" fill="#c0392b">^14  rejected</text>
  <text x="510" y="258" text-anchor="middle" font-size="11" fill="#c0392b">a prefix with no following atom fails at parse time</text>

  <!-- divider + takeaway -->
  <line x1="340" y1="30" x2="340" y2="270" stroke="#ddd" stroke-width="1"/>
  <rect x="90" y="286" width="500" height="28" rx="3" fill="#f7f7f7" stroke="#bbb"/>
  <text x="340" y="304" text-anchor="middle" font-size="12.5" font-style="italic">Same author intent; only one grammar makes the isotope a property of the atom.</text>
</svg>
