<svg xmlns="http://www.w3.org/2000/svg" width="480" height="240" viewBox="0 0 480 240" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="toc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>

  <!-- the defining fix -->
  <text x="56" y="46" text-anchor="middle" font-family="Courier, monospace" font-size="17" font-weight="bold">^14C</text>
  <line x1="56" y1="56" x2="56" y2="78" stroke="#333" stroke-width="1.4" marker-end="url(#toc-arrow)"/>

  <rect x="14" y="82" width="84" height="30" rx="3" fill="#e8f4ea" stroke="#2e7d43" stroke-width="1.4"/>
  <text x="56" y="94" text-anchor="middle" font-size="10.5" font-weight="bold">Atom</text>
  <text x="56" y="106" text-anchor="middle" font-size="8.5" fill="#2e7d43">C, isotope 14</text>
  <text x="56" y="128" text-anchor="middle" font-size="8" fill="#666">the isotope binds</text>
  <text x="56" y="139" text-anchor="middle" font-size="8" fill="#666">the atom</text>

  <line x1="98" y1="97" x2="128" y2="97" stroke="#333" stroke-width="1.4" marker-end="url(#toc-arrow)"/>

  <!-- the shared contract -->
  <rect x="132" y="66" width="128" height="62" rx="3" fill="#eef2f7" stroke="#5b7da6" stroke-width="1.4"/>
  <text x="196" y="84" text-anchor="middle" font-size="10.5" font-weight="bold">one contract</text>
  <text x="196" y="98" text-anchor="middle" font-size="8.5" fill="#555">semantic model + wire schemas</text>
  <text x="196" y="111" text-anchor="middle" font-size="8.5" fill="#555">+ conformance corpus</text>
  <text x="196" y="122" text-anchor="middle" font-size="8.5" fill="#555">(pinned tags gate every CI)</text>

  <!-- four implementations -->
  <line x1="260" y1="97" x2="288" y2="97" stroke="#333" stroke-width="1.4" marker-end="url(#toc-arrow)"/>
  <g font-size="9.5">
    <rect x="292" y="56" width="72" height="20" rx="3" fill="#fff" stroke="#2e7d43"/>
    <text x="328" y="70" text-anchor="middle">Ruby</text>
    <rect x="292" y="82" width="72" height="20" rx="3" fill="#fff" stroke="#5b7da6"/>
    <text x="328" y="96" text-anchor="middle">TypeScript</text>
    <rect x="292" y="108" width="72" height="20" rx="3" fill="#fff" stroke="#5b7da6"/>
    <text x="328" y="122" text-anchor="middle">Python</text>
    <rect x="292" y="134" width="72" height="20" rx="3" fill="#fff" stroke="#5b7da6"/>
    <text x="328" y="148" text-anchor="middle">Rust</text>
  </g>
  <text x="328" y="170" text-anchor="middle" font-size="8" fill="#666">conform, never reimplement</text>

  <!-- identity + citation -->
  <line x1="364" y1="97" x2="392" y2="97" stroke="#333" stroke-width="1.4" marker-end="url(#toc-arrow)"/>
  <rect x="396" y="62" width="72" height="76" rx="3" fill="#f4eef7" stroke="#7a5ba6" stroke-width="1.4"/>
  <text x="432" y="80" text-anchor="middle" font-size="10" font-weight="bold" fill="#5a3a7a">cite it</text>
  <text x="432" y="95" text-anchor="middle" font-size="8" fill="#555">InChI/Key native,</text>
  <text x="432" y="106" text-anchor="middle" font-size="8" fill="#555">oracle-exact</text>
  <text x="432" y="120" text-anchor="middle" font-size="8" fill="#555">resolver with</text>
  <text x="432" y="131" text-anchor="middle" font-size="8" fill="#555">provenance</text>

  <!-- bibitem strip -->
  <rect x="120" y="188" width="348" height="34" rx="3" fill="#fafafa" stroke="#999"/>
  <text x="132" y="202" font-size="8.5" font-weight="bold">[1] aspirin — PubChem substance record (dataset)</text>
  <text x="132" y="215" font-size="8" fill="#5a3a7a">inchikey=BSYNRYMUTXBXSQ-UHFFFAOYSA-N · retrieved 2026-11-10 · attributed</text>
  <line x1="432" y1="138" x2="432" y2="186" stroke="#7a5ba6" stroke-width="1.1" marker-end="url(#toc-arrow)"/>

  <!-- left rail caption -->
  <text x="12" y="14" font-size="10" font-weight="bold">AsciiChem: typed chemistry for standards documents</text>
</svg>
