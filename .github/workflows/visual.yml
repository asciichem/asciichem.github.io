name: Visual regression

# TODO.impl 23. Baselines are UBUNTU-CANONICAL: a run with no
# committed baselines writes them and passes (both toHaveScreenshot
# and toMatchSnapshot); the artifact is then committed by a
# maintainer. Local macOS runs may differ in font rendering.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Run visual tests (bootstrap when baselines are absent)
        run: |
          COUNT=      57
          if [ "$COUNT" -eq 0 ]; then
            echo 'No baselines committed — generating (write-and-pass).'
            npx playwright test --update-snapshots
          else
            npx playwright test
          fi
      - name: Upload baselines (commit these after generation runs)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-baselines
          path: tests/visual/baselines/
          if-no-files-found: warn
      - name: Upload report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
